name: Actualizar datos del club

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Escribir datos desde los secrets
        env:
          MEMBERS: ${{ secrets.MEMBERS_COUNT }}
          SPARK_SESSIONS: ${{ secrets.SPARK_SESSIONS }}
          FORGE_LABS: ${{ secrets.FORGE_LABS }}
          IGNITE_CONNECT: ${{ secrets.IGNITE_CONNECT }}
          FORGEHACK: ${{ secrets.FORGEHACK }}
          DEMO_DAYS: ${{ secrets.DEMO_DAYS }}
        run: python3 .github/scripts/set_site_data.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.js
          git diff --cached --quiet || git commit -m "chore: actualizar datos del club"
          git push